[tox]
envlist =
    pre-commit
    stardag-py{311,312,313,314}
    stardag-pyright
    stardag-examples-py{311,312,313,314}
    stardag-examples-pyright
    stardag-api-py{311,312,313,314}
    stardag-api-pyright
    stardag-ui
    integration-tests-pyright

# ============================================================================
# lib/stardag - Core SDK
# ============================================================================
[testenv:stardag-py{311,312,313,314}]
description = Run tests for stardag package (excludes the live Modal tier)
skip_install = true
allowlist_externals = uv
change_dir = lib/stardag
# Both halves are needed, and they do different jobs. `-m "not modal_live"`
# deselects the tier; STARDAG_MODAL_LIVE_TESTS=0 stops `live_modal_guard` from
# making a network round-trip per module first, because marker deselection
# happens *after* module import. Without the env var an ordinary test run --
# local or CI -- still talks to Modal seven times before deciding to skip.
setenv =
    STARDAG_MODAL_LIVE_TESTS = 0
commands_pre =
    uv sync --active --all-extras
commands =
    uv run --active pytest --markdown-docs -m "not modal_live" {posargs:tests}

# The live Modal tier. Deliberately absent from `envlist` and from the
# [gh-actions] mapping below: it hits a real Modal workspace, so it runs only
# when something asks for it by name -- the modal-live workflow, or a developer
# who has exported the variables below.
[testenv:stardag-modal-live]
description = Run the live Modal test tier (hits a real Modal workspace)
skip_install = true
allowlist_externals = uv
basepython = python3.12
change_dir = lib/stardag
passenv =
    MODAL_*
    STARDAG_MODAL_*
# Require mode by default. Running this env *is* the request to run the live
# tier, so the "auto" default -- which skips on missing credentials or a
# profile mismatch and still exits 0 -- would defeat its whole purpose. Still
# overridable (`STARDAG_MODAL_LIVE_TESTS=auto tox -e stardag-modal-live`) for
# anyone who wants the skip-if-unavailable behaviour.
setenv =
    STARDAG_MODAL_LIVE_TESTS = {env:STARDAG_MODAL_LIVE_TESTS:1}
commands_pre =
    uv sync --active --all-extras
commands =
    uv run --active pytest -m modal_live {posargs:tests/test_integration/test_modal}

[testenv:stardag-pyright]
description = Type check stardag package
skip_install = true
allowlist_externals = uv
change_dir = lib/stardag
commands_pre =
    uv sync --active --all-extras
commands =
    uv run --active pyright src tests

# ============================================================================
# lib/stardag-examples - Examples package
# ============================================================================
# Uses published stardag from PyPI. When making breaking changes to lib/stardag
# that aren't yet released, add `uv pip install -e ../stardag` to commands_pre
# and use `--no-sync` in commands. Revert after publishing the new version.
# Example:
#   commands_pre =
#       uv sync --active --all-extras
#       uv pip install -e ../stardag
#   commands =
#       uv run --active --no-sync pytest {posargs:tests}
[testenv:stardag-examples-py{311,312,313,314}]
description = Run tests for stardag-examples package
skip_install = true
allowlist_externals = uv
change_dir = lib/stardag-examples
commands_pre =
    uv sync --active --all-extras
commands =
    uv run --active pytest {posargs:tests}

[testenv:stardag-examples-pyright]
description = Type check stardag-examples package
skip_install = true
allowlist_externals = uv
change_dir = lib/stardag-examples
commands_pre =
    uv sync --active --all-extras
commands =
    uv run --active pyright src tests

# ============================================================================
# app/stardag-api - API service
# ============================================================================
[testenv:stardag-api-py{311,312,313,314}]
description = Run tests for stardag-api package
skip_install = true
allowlist_externals = uv
change_dir = app/stardag-api
commands_pre =
    uv sync --active --all-extras
commands =
    uv run pytest {posargs:tests}

[testenv:stardag-api-pyright]
description = Type check stardag-api package
skip_install = true
allowlist_externals = uv
change_dir = app/stardag-api
commands_pre =
    uv sync --active --all-extras
commands =
    uv run --active pyright src tests

# ============================================================================
# app/stardag-ui - Frontend
# ============================================================================
[testenv:stardag-ui]
description = Run tests for stardag-ui frontend
skip_install = true
allowlist_externals = npm
change_dir = app/stardag-ui
commands_pre =
    npm install
commands =
    npm test

# ============================================================================
# Integration Tests (requires docker-compose services running)
# ============================================================================
[testenv:integration]
description = Run integration tests (requires docker-compose up)
skip_install = true
allowlist_externals = uv
basepython = python3.12
change_dir = integration-tests
passenv =
    STARDAG_API_URL
    KEYCLOAK_URL
    STARDAG_UI_URL
    STARDAG_DB_HOST
    STARDAG_DB_PORT
commands_pre =
    uv sync
commands =
    uv run pytest {posargs}

[testenv:registry-modal-live]
description = Run the registry-live scenarios against an already-provisioned Modal stack
# Kept out of envlist and out of [gh-actions] on purpose: this env drives
# real Modal containers, so it must never be reached by a bare `tox`. The
# test root below is likewise outside the project's own `testpaths`, so a
# bare `pytest` does not reach it either.
#
# It deploys nothing. Bring a stack up first, and tear it down after:
#
#   python -m stardag_integration_tests.registry_live.provision up
#   tox -e registry-modal-live
#   python -m stardag_integration_tests.registry_live.provision down
#
# Keeping the stack between runs is the point -- re-running one scenario
# against a live stack takes seconds rather than the minute a deploy costs.
skip_install = true
allowlist_externals = uv
basepython = python3.12
change_dir = integration-tests
passenv =
    MODAL_*
    STARDAG_*
setenv =
    # On by default in this env: reaching it at all is already an explicit
    # act, and a silent skip here would be the failure the tier exists to
    # prevent. See the guard's module docstring.
    STARDAG_REGISTRY_LIVE_TESTS = 1
    # Pins the interpreter `uv sync` builds the venv with, which basepython
    # above does not. It has to be pinned rather than left to uv's default:
    # both Modal images this tier builds take their Python from whatever
    # interpreter serializes their functions, so the provisioning step and
    # the run must agree, and the version must be one Modal's base images
    # offer.
    UV_PYTHON = 3.12
commands_pre =
    uv sync
# Concurrent because these scenarios are almost entirely sleep: each one
# waits on Modal containers it does not own, so running them together
# costs little more than running the longest. They share one registry,
# which serves them concurrently, and each salts its own task ids.
#
# A fixed worker count rather than `-n auto`: auto sizes to the machine's
# CPUs, which on a laptop meant sixteen processes for three I/O-bound
# tests -- sixteen interpreter startups, and sixteen copies of the guard's
# start-up round trip against a registry that is deliberately one
# container. Four covers the scenarios with headroom; raise it if the tier
# grows well past that.
#
# **To debug a failure, run them one at a time**: the shared registry and
# interleaved logs make a low-level bug much harder to read concurrently.
#
#   tox -e registry-modal-live -- -n0 -k cross_build_wake
#
# In CI the same switch is the `serial` input on workflow_dispatch.
commands =
    uv run pytest -n 4 {posargs:tests_registry_live}

[testenv:integration-browser]
description = Run integration tests including browser tests (requires docker-compose up)
skip_install = true
allowlist_externals = uv
basepython = python3.12
change_dir = integration-tests
passenv =
    STARDAG_API_URL
    KEYCLOAK_URL
    STARDAG_UI_URL
    STARDAG_DB_HOST
    STARDAG_DB_PORT
commands_pre =
    uv sync --extra browser
    uv run playwright install chromium
commands =
    uv run pytest {posargs}

[testenv:integration-tests-pyright]
description = Type check integration tests
skip_install = true
allowlist_externals = uv
change_dir = integration-tests
commands_pre =
    uv sync --active --group dev --extra browser
commands =
    uv run --active pyright src tests

# ============================================================================
# Pre-commit (formatting/linting)
# ============================================================================
[testenv:pre-commit]
description = Run pre-commit hooks (formatting, linting)
skip_install = true
deps = pre-commit
# Skip pyright checks in pre-commit to avoid double type checking
# (they are run in their own tox envs)
setenv =
    SKIP = pyright-stardag,pyright-stardag-examples,pyright-stardag-api,pyright-integration-tests
commands = pre-commit run --all-files --show-diff-on-failure

# ============================================================================
# GitHub Actions mapping
# ============================================================================
[gh-actions]
# NOTE: pyright for stardag-api and integration-tests is only run for Python 3.12 in CI atm, to reduce total run time
python =
    3.11: stardag-py311, stardag-examples-py311, stardag-api-py311, stardag-pyright, stardag-examples-pyright
    3.12: stardag-py312, stardag-examples-py312, stardag-api-py312, stardag-pyright, stardag-examples-pyright, stardag-api-pyright, integration-tests-pyright
    3.13: stardag-py313, stardag-examples-py313, stardag-api-py313, stardag-pyright, stardag-examples-pyright
    3.14: stardag-py314, stardag-examples-py314, stardag-api-py314, stardag-pyright, stardag-examples-pyright
