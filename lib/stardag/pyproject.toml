[project]
name = "stardag"
dynamic = ["version"]
description = "Declarative and composable DAG framework for Python with persistent asset management"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Anders Huss", email = "info@stardag.com" }]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "aiofiles>=23.1.0",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.1.0",
    "uuid6>=2022.6.25",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "tomli-w>=1.0.0",
    "tenacity>=8.1.0",
]

[project.optional-dependencies]
prefect = [
    "prefect>=3.0.3",
    "asyncpg>=0.30.0; python_version >= '3.13'",
]
s3 = [
    "boto3>=1.34",
    "botocore>=1.36",
    "boto3-stubs[s3]",
    "aioboto3>=13.0.0",
    "types-aioboto3[s3]",
]
modal = [
    "modal>=1.0.0",
]
selfhost = [
    "modal>=1.0.0",
    "cryptography>=50.0.0",
]
pandas = [
    "pandas>=2.1.0",
]

[project.scripts]
stardag = "stardag._cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "ipython>=8.25.0",
    "pytest-asyncio>=0.23.7",
    "ipdb>=0.13.13",
    "pyright>=1.1.359",
    "ruff>=0.14.11",
    "pytest-markdown-docs>=0.9.0",
]

[tool.uv]
package = true

[build-system]
# setuptools-scm >= 9 for `scm.git.describe_command` below (8.x rejects the
# key with a TypeError, which fails the build rather than misversioning it).
requires = ["hatchling", "hatch-vcs", "setuptools-scm>=9"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

# The SDK is versioned from its own tags only. The repo carries two tag
# families, often on the same commit: `vX.Y.Z` (this package) and
# `server-vX.Y.Z` (the server image). An unfiltered `git describe --tags`
# considers both, so a non-release build could be versioned from the server's
# tags (e.g. 0.7.1.devN instead of 0.29.1.devN), and a build exactly at a
# release commit could report the server's X.Y.Z. `--match` restricts describe
# to SDK tags; `tag_regex` rejects anything else that reaches the parser.
# `scripts/test_version_tags.py` (a pre-commit hook) checks both families.
[tool.hatch.version.raw-options]
root = "../.."
scm.git.describe_command = [
    "git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*",
]
# `tag_regex` is deprecated in setuptools-scm 10 in favour of `tag.regex`, but
# the latter is not a `get_version()` argument, so through hatch-vcs's
# raw-options this is still the only spelling that takes effect.
tag_regex = '^v(?P<version>[0-9]+(?:\.[0-9]+)*(?:(?:a|b|rc)[0-9]+)?(?:\.post[0-9]+)?)$'

[tool.hatch.build.targets.wheel]
packages = ["src/stardag"]

[tool.isort]
profile = "black"
known_local_folder = ["stardag"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/stardag", "../../USER_GUIDE.md"]
asyncio_mode = "auto"
markers = [
    "modal_live: hits a real Modal workspace (gated by STARDAG_MODAL_LIVE_TESTS / STARDAG_MODAL_TEST_PROFILE; see stardag.testing.modal)",
]
