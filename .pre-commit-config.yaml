repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        args: [--prose-wrap=preserve, --print-width=88]
        exclude: ^docs/site/|^docs/docs/reference/api\.md$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args:
          - --fix
        exclude: ^docs/site/|/code-examples/
      - id: ruff-format
        exclude: ^docs/site/|/code-examples/
  # Pyright hooks - one per Python package, each using its own .venv
  - repo: local
    hooks:
      # Lockfile freshness. Nothing else catches drift: tox runs plain
      # `uv sync`, which silently re-resolves a stale lock, so CI ends up
      # testing a resolution nobody committed. One hook covers every uv
      # project — the script discovers them from the committed lockfiles.
      - id: uv-lock-check
        name: uv lock --check (all uv projects)
        entry: scripts/check-uv-locks.sh
        language: system
        files: (^|/)(pyproject\.toml|uv\.lock)$
        pass_filenames: false
        verbose: true
      # Action pins. The workflows reference every action by commit SHA; this
      # asserts that they still all do. A single unpinned `uses:` added later
      # — in, say, the job that publishes to PyPI — would otherwise undo the
      # property silently, since nothing about a workflow file makes a
      # movable ref look wrong.
      - id: check-action-pins
        name: actions pinned to commit SHAs
        entry: scripts/check_action_pins.py
        # `python` rather than `system`: pre-commit builds the hook its own
        # env, so pyyaml is guaranteed without asking every contributor (or
        # the CI runner) to have it. The check parses the workflows because
        # `uses` is a mapping key, not a line format — see the module
        # docstring.
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        # The checker and this config are in the pattern too. Editing either
        # should re-verify: a change to the thing that does the verifying, or
        # to the entry/deps/filter that decide whether it runs at all, would
        # otherwise land without anything checking the workflows.
        files: ^(\.github/workflows/.*\.ya?ml|scripts/check_action_pins\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        verbose: true
      # The checker's own tests. It fails in the safe-looking direction — a
      # bypass returns "fine" rather than raising — so the hook staying green
      # is not evidence on its own. Four bypasses were found by review; these
      # are what stop a later edit reopening one.
      - id: check-action-pins-tests
        name: actions pinned to commit SHAs (tests)
        entry: python -m pytest scripts/test_check_action_pins.py --noconftest -q
        language: python
        additional_dependencies: ["pyyaml==6.0.3", "pytest==9.1.1"]
        files: ^(scripts/(check_action_pins|test_check_action_pins)\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
        verbose: true
      - id: pyright-stardag
        name: pyright (lib/stardag)
        entry: bash -c 'cd lib/stardag && uv sync --all-extras && uv run pyright src tests'
        language: system
        files: ^lib/stardag/
        types: [python]
        pass_filenames: false
        verbose: true
      - id: pyright-stardag-examples
        name: pyright (lib/stardag-examples)
        # Uses published stardag from PyPI. When making breaking changes to
        # lib/stardag that aren't yet released, temporarily replace with the line below.
        # Revert after publishing the new stardag version.
        entry: bash -c 'cd lib/stardag-examples && uv sync --all-extras && uv run pyright src tests'
        # entry: bash -c 'cd lib/stardag-examples && uv sync --all-extras && uv pip install -e ../stardag && uv run --no-sync pyright src tests'
        language: system
        files: ^lib/stardag-examples/
        types: [python]
        pass_filenames: false
        verbose: true
      - id: pyright-stardag-api
        name: pyright (app/stardag-api)
        entry: bash -c 'cd app/stardag-api && uv sync --all-extras && uv run pyright src tests'
        language: system
        files: ^app/stardag-api/
        types: [python]
        pass_filenames: false
        verbose: true
      - id: pyright-integration-tests
        name: pyright (integration-tests)
        entry: bash -c 'cd integration-tests && uv sync --all-extras && uv run pyright src tests'
        language: system
        files: ^integration-tests/
        types: [python]
        pass_filenames: false
        verbose: true
      # TypeScript/React hooks for stardag-ui
      - id: eslint-stardag-ui
        name: eslint (app/stardag-ui)
        entry: bash -c 'cd app/stardag-ui && npm run lint'
        language: system
        files: ^app/stardag-ui/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
        verbose: true
      - id: tsc-stardag-ui
        name: tsc (app/stardag-ui)
        entry: bash -c 'cd app/stardag-ui && npx tsc -b'
        language: system
        files: ^app/stardag-ui/.*\.(ts|tsx)$
        pass_filenames: false
        verbose: true
