repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        args: [--prose-wrap=preserve, --print-width=88]
        exclude: ^docs/site/|^docs/docs/reference/api\.md$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args:
          - --fix
        exclude: ^docs/site/|/code-examples/
      - id: ruff-format
        exclude: ^docs/site/|/code-examples/
  # Pyright hooks - one per Python package, each using its own .venv
  - repo: local
    hooks:
      # Lockfile freshness. Nothing else catches drift: tox runs plain
      # `uv sync`, which silently re-resolves a stale lock, so CI ends up
      # testing a resolution nobody committed. One hook covers every uv
      # project — the script discovers them from the committed lockfiles.
      - id: uv-lock-check
        name: uv lock --check (all uv projects)
        entry: scripts/check-uv-locks.sh
        language: system
        files: (^|/)(pyproject\.toml|uv\.lock)$
        pass_filenames: false
        verbose: true
      - id: pyright-stardag
        name: pyright (lib/stardag)
        entry: bash -c 'cd lib/stardag && uv sync --all-extras && uv run pyright src tests'
        language: system
        files: ^lib/stardag/
        types: [python]
        pass_filenames: false
        verbose: true
      - id: pyright-stardag-examples
        name: pyright (lib/stardag-examples)
        # Uses published stardag from PyPI. When making breaking changes to
        # lib/stardag that aren't yet released, temporarily replace with the line below.
        # Revert after publishing the new stardag version.
        entry: bash -c 'cd lib/stardag-examples && uv sync --all-extras && uv run pyright src tests'
        # entry: bash -c 'cd lib/stardag-examples && uv sync --all-extras && uv pip install -e ../stardag && uv run --no-sync pyright src tests'
        language: system
        files: ^lib/stardag-examples/
        types: [python]
        pass_filenames: false
        verbose: true
      - id: pyright-stardag-api
        name: pyright (app/stardag-api)
        entry: bash -c 'cd app/stardag-api && uv sync --all-extras && uv run pyright src tests'
        language: system
        files: ^app/stardag-api/
        types: [python]
        pass_filenames: false
        verbose: true
      - id: pyright-integration-tests
        name: pyright (integration-tests)
        entry: bash -c 'cd integration-tests && uv sync --all-extras && uv run pyright src tests'
        language: system
        files: ^integration-tests/
        types: [python]
        pass_filenames: false
        verbose: true
      # TypeScript/React hooks for stardag-ui
      - id: eslint-stardag-ui
        name: eslint (app/stardag-ui)
        entry: bash -c 'cd app/stardag-ui && npm run lint'
        language: system
        files: ^app/stardag-ui/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
        verbose: true
      - id: tsc-stardag-ui
        name: tsc (app/stardag-ui)
        entry: bash -c 'cd app/stardag-ui && npx tsc -b'
        language: system
        files: ^app/stardag-ui/.*\.(ts|tsx)$
        pass_filenames: false
        verbose: true
