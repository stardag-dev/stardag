[project]
name = "stardag-api"
version = "0.0.1"
description = "Stardag API service for task tracking and monitoring"
authors = [{ name = "Anders Huss", email = "andhus@kth.se" }]
requires-python = ">=3.10"
dependencies = [
    # fastapi>=0.141 pulls the starlette 1.x line; paired with the starlette
    # floor below it clears the StaticFiles UNC-path SSRF and the
    # form()-limits DoS advisories.
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.7.1",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "bcrypt>=4.0.0",
    "uuid_utils>=0.9.0",
    "boto3>=1.35.0",
    # Already installed transitively (gunicorn depends on it); declared
    # explicitly because sdk_compat imports it directly for PEP 440 version
    # comparison, and relying on someone else's transitive dep for that is
    # how it disappears in a future gunicorn release.
    "packaging>=23.0",
    # --- Security floors on transitive dependencies ---
    # The production image builds from this file (uv pip install .), not from
    # uv.lock, so a vulnerable transitive version is only excluded from a
    # fresh build if the floor lives here. Each of these is pulled in by a
    # parent above; the floor is the first patched version.
    "starlette>=1.3.1",  # via fastapi — StaticFiles UNC SSRF, form() DoS
    "urllib3>=2.7.0",  # via boto3 — decompression-bomb / cross-origin headers
    "cryptography>=50.0.0",  # via python-jose[cryptography] — several CVEs
    "mako>=1.3.12",  # via alembic — TemplateLookup path traversal
    # via python-jose -> rsa — decoder DoS. Remove together with python-jose
    # if/when it is replaced (see the security-scanning follow-ups).
    "pyasn1>=0.6.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pyright>=1.1.359",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stardag_api"]

[tool.isort]
profile = "black"
known_local_folder = ["stardag_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
