# Dependabot configuration.
#
# Scanning was enabled without an update config, so alerts accumulated with
# no PRs to clear them. This keeps every manifest updated on a weekly cadence,
# grouped into one PR per ecosystem per week to avoid a flood of single-dep PRs.
#
# Ecosystems:
#   - uv: all Python projects. Every one is a uv project with a committed
#     uv.lock, and dependabot's uv updater reads pyproject.toml and uv.lock
#     natively. This used to say `pip`, which is what let the uv updater run
#     outside the group below — see the note at the end of this file.
#   - npm: the UI and the AWS CDK tooling
#   - github-actions: workflow action pins
#
# `directory`/`directories` take no glob patterns, so every project is listed
# explicitly. A new Python project needs a line here or dependabot ignores it.
version: 2
updates:
  - package-ecosystem: "uv"
    directories:
      - "/app/stardag-api"
      - "/lib/stardag"
      - "/lib/stardag-examples"
      - "/lib/stardag-examples/standalone/stardag-modal"
      - "/docs"
      - "/integration-tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Minor and patch only. Majors arrive one PR per package, so a single
      # unresolvable one cannot hold the safe updates hostage.
      #
      # These six stay in ONE entry on purpose, unlike npm below. They share
      # path dependencies: a constraint edited in lib/stardag's manifest
      # invalidates the locks of /docs and /integration-tests too, and one PR
      # that carries the manifest and every affected lock together is exactly
      # what stops a lock being left behind.
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The two npm directories get an entry each, unlike the uv projects above.
  # They share no dependency purpose — the UI and the CDK tooling — so there is
  # nothing to gain from a common PR and something to lose: a break in either
  # blocked the other. #276 was one PR across both.
  #
  # The limit is 5 each rather than 10, so the npm total stays at the 10 it was
  # before the split instead of quietly doubling. Majors now arrive
  # individually, so the cap does real work; raise it if majors start queueing
  # behind each other, which would be the same blocking problem in miniature.
  - package-ecosystem: "npm"
    directory: "/app/stardag-ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      stardag-ui-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/infra/aws-cdk"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      aws-cdk-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Deliberately left as one all-update-types group. Action pins are written
  # `@v7`, so almost every bump reads as a major — a minor/patch split here
  # would turn one tidy PR into a stream of individual ones for no benefit.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
# Why `uv` and not `pip`
#
# These six directories were declared under `pip` and the group still did not
# apply to all of them. The branch names show it: the cryptography bump landed
# as `dependabot/uv/docs/cryptography-gte-50.0.0` and
# `dependabot/uv/integration-tests/cryptography-gte-50.0.0` — the `uv`
# updater, and no `python-<hash>` group suffix — while the standalone Modal
# example came through as `dependabot/pip/.../python-f0b66d50f1`, grouped.
# One dependency, two ungrouped PRs, which is the exact flood the group exists
# to prevent.
#
# It also explains a stale lockfile. Scoped to `/docs`, dependabot edited the
# constraint where it is declared — `lib/stardag/pyproject.toml` — and
# regenerated only `/docs`'s lock, leaving `lib/stardag/uv.lock` behind.
# Declaring each project under the ecosystem dependabot actually routes it to
# is what gets its own lock refreshed by the bump that changes its manifest.
