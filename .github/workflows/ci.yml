name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
  release:
    types: [published, edited]

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/stardag-ui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: app/stardag-ui
      # Skip pyright hooks in pre-commit (they're informational with || true anyway)
      # Pyright runs separately in tox when needed
      - name: Set environment variable to skip pyright
        run: echo "SKIP=pyright-stardag,pyright-stardag-examples,pyright-stardag-api,pyright-integration-tests" >> $GITHUB_ENV
      - uses: pre-commit/action@v3.0.1

  test-python:
    name: Test Python (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox tox-gh-actions
      - name: Cache tox environments
        id: cache-tox
        uses: actions/cache@v6
        with:
          path: .tox
          key: ${{ runner.os }}-${{ matrix.python-version }}-tox-${{ hashFiles('**/pyproject.toml', 'uv.lock') }}
      - name: Test with tox
        run: tox

  test-python-pg:
    name: Test Python (stardag-api on Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stardag
          POSTGRES_PASSWORD: stardag
          POSTGRES_DB: stardag
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply init.sql to create stardag_admin / service / readonly roles
        env:
          PGPASSWORD: stardag
        run: |
          psql -h localhost -U stardag -d stardag < docker/postgres/init.sql
      - name: Create test database owned by stardag_admin
        env:
          PGPASSWORD: stardag
        run: |
          psql -h localhost -U stardag -d stardag -c "CREATE DATABASE stardag_test OWNER stardag_admin;"
      - name: Install tox
        run: pip install tox
      - name: Run stardag-api tests against Postgres
        env:
          # The pg_engine fixture skips silently when this is unset;
          # setting it makes the migration-applied PG-only tests
          # (test_dependency_reconciliation.py, test_status_denormalisation.py)
          # actually fire on every PR.
          STARDAG_API_TEST_DATABASE_URL: postgresql+asyncpg://stardag_admin:stardag_admin@localhost:5432/stardag_test
        run: tox -e stardag-api-py312

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/stardag-ui

    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/stardag-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build

  # infra/aws-cdk and the standalone Modal example are both dependabot-managed
  # and, until now, built by nothing. A bump that broke either merged green —
  # see the TypeScript 7 / ts-jest peer conflict and the TypeScript 6 @types
  # change that #276 hit in infra/aws-cdk, both caught only by hand.
  test-infra-cdk:
    name: Test Infra (aws-cdk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws-cdk

    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: infra/aws-cdk/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # Synths the stacks in-process; needs no AWS credentials.
      - name: Run tests
        run: npm test

  # Installability only. Real Modal coverage for the examples is STA-15's
  # modal-live workflow, not this job: no credentials are available here, and
  # the import below is deliberately the whole test.
  test-example-standalone-modal:
    name: Test Example (standalone stardag-modal)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib/stardag-examples/standalone/stardag-modal

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      # Defining the image, the StardagApp and the DAG happens at import time,
      # so this catches an example that no longer even loads against the
      # stardag it pins. It does not reach Modal.
      - name: Import the example
        run: uv run --no-sync python -c "import stardag_modal.main"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/stardag-ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app/stardag-ui

      - name: Build frontend
        run: npm run build
        working-directory: app/stardag-ui

      - name: Start docker-compose services
        run: docker compose up -d --build
        working-directory: docker

      - name: Wait for services to be ready
        run: |
          echo "Waiting for Keycloak..."
          for i in {1..60}; do
            # Use OIDC discovery endpoint - health endpoint is on port 9000 which is not exposed
            if curl -sf http://localhost:8080/realms/stardag/.well-known/openid-configuration > /dev/null 2>&1; then
              echo "Keycloak is ready!"
              break
            fi
            echo "Waiting for Keycloak... ($i/60)"
            sleep 5
          done

          echo "Waiting for API..."
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is ready!"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done

      - name: Install tox
        run: pip install tox

      - name: Run integration tests
        run: tox -e integration

      - name: Run integration tests pyright
        run: tox -e integration-pyright

      - name: Show docker logs on failure
        if: failure()
        run: docker compose logs
        working-directory: docker

      - name: Stop docker-compose services
        if: always()
        run: docker compose down -v
        working-directory: docker

  integration-tests-browser:
    name: Integration Tests (Browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/stardag-ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app/stardag-ui

      - name: Build frontend
        run: npm run build
        working-directory: app/stardag-ui

      - name: Start docker-compose services
        run: docker compose up -d --build
        working-directory: docker

      - name: Wait for services to be ready
        run: |
          echo "Waiting for Keycloak..."
          for i in {1..60}; do
            # Use OIDC discovery endpoint - health endpoint is on port 9000 which is not exposed
            if curl -sf http://localhost:8080/realms/stardag/.well-known/openid-configuration > /dev/null 2>&1; then
              echo "Keycloak is ready!"
              break
            fi
            echo "Waiting for Keycloak... ($i/60)"
            sleep 5
          done

          echo "Waiting for API..."
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is ready!"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done

          echo "Waiting for UI..."
          for i in {1..30}; do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "UI is ready!"
              break
            fi
            echo "Waiting for UI... ($i/30)"
            sleep 2
          done

      - name: Install tox
        run: pip install tox

      - name: Run browser integration tests
        run: tox -e integration-browser

      - name: Show docker logs on failure
        if: failure()
        run: docker compose logs
        working-directory: docker

      - name: Stop docker-compose services
        if: always()
        run: docker compose down -v
        working-directory: docker
