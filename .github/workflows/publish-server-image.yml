# Server release pipeline: pushing a `server-vX.Y.Z` tag publishes the
# combined server image (Registry API + web UI, one joint version) to
# ghcr.io/stardag-dev/stardag-server:{X.Y.Z,latest} and creates a GitHub
# Release with the built UI dist attached (for deployments that serve the
# UI separately, e.g. from S3/CDN).
#
# A `server-vX.Y.ZrcN` tag also runs this pipeline, for a release candidate.
# It publishes only `:X.Y.ZrcN` — an rc never replaces the mutable `:latest`
# tag — and its GitHub Release is marked pre-release. That is distinct from
# what `stardag self-host up`/`upgrade` deploys by default (their own
# `DEFAULT_SERVER_VERSION` pin, which an SDK release cut during a
# pre-release window may intentionally point at the rc); see DEV_README.md
# "Pre-release".
#
# The server is versioned independently of the SDK (`v*` tags — see
# publish.yml). The single image definition lives in app/server.Dockerfile.
#
# Every action here is pinned to a commit SHA, with the release it corresponds
# to in the trailing comment. This job holds `packages: write` and pushes the
# image that `stardag self-host up` pulls by default, so a movable ref here is
# a path to a malicious server image running in someone else's account. See
# the note in publish.yml; `scripts/check_action_pins.py` asserts the pins.
name: Publish Server Image

on:
  push:
    tags:
      - "server-v[0-9]+.[0-9]+.[0-9]+"
      - "server-v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

jobs:
  publish-image:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#server-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *rc* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One-time note (first release only): the initial push creates the
      # GHCR package with PRIVATE visibility. `stardag self-host` pulls the
      # image anonymously (`modal.Image.from_registry` without credentials),
      # so the package must be switched to public — see "Releasing the
      # Server" in DEV_README.md for the step.
      #
      # `latest` is omitted for an rc (`is_prerelease`), so it never becomes
      # what a consumer of the mutable `latest` tag pulls (that is separate
      # from `DEFAULT_SERVER_VERSION`, which a pinned SDK may intentionally
      # point at the rc — see the top-of-file comment). The conditional
      # expression yields an empty line in that case, which
      # docker/build-push-action's multi-line `tags` input ignores.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/server.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/stardag-server:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.is_prerelease == 'false' && format('ghcr.io/{0}/stardag-server:latest', github.repository_owner) || '' }}
          build-args: |
            STARDAG_SERVER_VERSION=${{ steps.version.outputs.version }}

  github-release:
    name: GitHub Release with UI dist
    needs:
      - publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Extract version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#server-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *rc* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract the UI dist from the image that was just pushed (instead of
      # rebuilding it on the runner) so the release asset is byte-identical
      # to what the image serves. Flat layout (index.html at the tar root) —
      # downstream extractors depend on it.
      - name: Extract UI dist from the pushed image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/stardag-server:${{ steps.version.outputs.version }}
        run: |
          docker pull "$IMAGE"
          cid=$(docker create "$IMAGE")
          docker cp "$cid:/opt/stardag/ui" ./ui-dist
          docker rm "$cid"

      - name: Package UI dist
        run: >-
          tar -czf
          "stardag-ui-dist-${{ steps.version.outputs.version }}.tar.gz"
          -C ui-dist .

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRERELEASE_FLAG: ${{ steps.version.outputs.is_prerelease == 'true' && '--prerelease' || '' }}
        run: >-
          gh release create
          '${{ github.ref_name }}'
          --repo '${{ github.repository }}'
          --title 'Stardag Server ${{ steps.version.outputs.version }}'
          --notes 'Combined server image (Registry API + web UI):
          `ghcr.io/${{ github.repository_owner }}/stardag-server:${{ steps.version.outputs.version }}`


          See the [changelog](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)
          for what changed (Registry API / UI / Deployment sections).


          The attached `stardag-ui-dist-${{ steps.version.outputs.version }}.tar.gz`
          contains the built web UI for deployments that serve it separately.'
          $PRERELEASE_FLAG

      - name: Upload UI dist to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release upload
          '${{ github.ref_name }}'
          'stardag-ui-dist-${{ steps.version.outputs.version }}.tar.gz'
          --repo '${{ github.repository }}'
